<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bike Shop - Order</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  

  <nav>
    <a href="index.html">Display</a>
    <a href="information.html">Information</a>
    <a href="order.html">Order</a>
  </nav>

  <section>
        <form action="#" method="post">

            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <label for="contact">Contact No.:</label><br>
            <input type="tel" id="contact" name="contact" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="bike">Select Bike Model:</label><br>
            <select id="bike" name="bike">
                <option value="Mountain Bike WheelSet">Mountain Bike Wheel</option>
                <option value="Saddle">Saddle</option>
                <option value="Pedals">Pedals</option>
            </select><br><br>

            <label for="quantity">Quantity:</label><br>
            <input type="number" id="quantity" name="quantity" min="1" required><br><br>

            <label for="address">Delivery Address:</label><br>
            <textarea id="address" name="address" rows="4" required></textarea><br><br>

            <button type="submit">Submit Order</button>

        </form>
    </section>

 

  <footer>
    <p>&copy; 2025 BikelowBike Store. All rights reserved.</p>
  </footer>

</body>
</html>
